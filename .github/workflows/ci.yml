name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:consumers

  test:
    name: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # the 100% coverage gate runs on linux; host-only branches (bash signals) are unreachable elsewhere
      - if: runner.os == 'Linux'
        run: bun run test
      - if: runner.os != 'Linux'
        run: bun run test:unit
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: packages/core/coverage/coverage-summary.json
      - run: bun run test:consumers
        env:
          WORKERSTACK_SYSTEM_REAL_INSTALL: "1"

  docker:
    name: docker e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:docker

  # every built-in really installs, then check must report the pinned version
  catalog-install:
    name: catalog install (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        group: [runtimes, languages, release, cloudflare, database, browsers, agents]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Allow Chocolatey confirmation
        if: runner.os == 'Windows'
        run: choco feature enable -n allowGlobalConfirmation
      - name: Install the ${{ matrix.group }} group
        run: bun e2e/catalog-install.ts --group ${{ matrix.group }}
        env:
          WORKERSTACK_SYSTEM_INSTALL_TIMEOUT_MS: "900000"

  # the same installs on dnf and pacman, which no hosted runner provides
  catalog-install-linux:
    name: catalog install (${{ matrix.distro }}, ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [dnf, pacman]
        group: [runtimes, languages, release, cloudflare, database, browsers, agents]
    steps:
      - uses: actions/checkout@v4
      - name: Build the ${{ matrix.distro }} image
        run: docker build -f e2e/docker/linux-${{ matrix.distro }}.Dockerfile -t system-${{ matrix.distro }} .
      - name: Install the ${{ matrix.group }} group
        run: >
          docker run --rm -v "$PWD:/src" -w /src -e SHELL=/bin/bash
          -e WORKERSTACK_SYSTEM_INSTALL_TIMEOUT_MS=900000
          system-${{ matrix.distro }}
          bash -c "bun install --frozen-lockfile && bun e2e/catalog-install.ts --group ${{ matrix.group }}"
