services:
  linux-apt:
    image: system-e2e-apt
    build:
      context: ../../..
      dockerfile: packages/playground/docker/linux-apt.Dockerfile
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      EXPECT_OS: linux-apt
    command:
      [
        "bash",
        "-c",
        "cd packages/playground && bun --bun vitest run src/os-install.test.ts && bun run test:real-install",
      ]

  linux-dnf:
    image: system-e2e-dnf
    build:
      context: ../../..
      dockerfile: packages/playground/docker/linux-dnf.Dockerfile
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      EXPECT_OS: linux-dnf
    command:
      [
        "bash",
        "-c",
        "cd packages/playground && bun --bun vitest run src/os-install.test.ts && bun run test:real-install",
      ]

  linux-pacman:
    image: system-e2e-pacman
    build:
      context: ../../..
      dockerfile: packages/playground/docker/linux-pacman.Dockerfile
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      EXPECT_OS: linux-pacman
    command:
      [
        "bash",
        "-c",
        "cd packages/playground && bun --bun vitest run src/os-install.test.ts && bun run test:real-install",
      ]

  windows:
    image: system-e2e-apt
    build:
      context: ../../..
      dockerfile: packages/playground/docker/linux-apt.Dockerfile
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      WORKERSTACK_SYSTEM_OS: windows
      EXPECT_OS: windows
    command: ["bash", "-c", "cd packages/playground && bun --bun vitest run src/os-install.test.ts"]

  macos:
    image: system-e2e-apt
    build:
      context: ../../..
      dockerfile: packages/playground/docker/linux-apt.Dockerfile
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      WORKERSTACK_SYSTEM_OS: macos
      EXPECT_OS: macos
    command: ["bash", "-c", "cd packages/playground && bun --bun vitest run src/os-install.test.ts"]
